<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Listen beat annotator</title>
  <style>
    :root {
      --bg: #12141a;
      --panel: #1c2030;
      --text: #e8ecf4;
      --muted: #9aa3b8;
      --accent: #6ea8ff;
      --ok: #5fd38d;
      --warn: #ffcc66;
      --danger: #ff7b7b;
      --border: #2d3548;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font: 14px/1.45 system-ui, Segoe UI, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 16px;
      align-items: center;
      flex-wrap: wrap;
    }
    header h1 { margin: 0; font-size: 16px; font-weight: 600; }
    .meta { color: var(--muted); font-size: 12px; }
    main {
      display: grid;
      grid-template-columns: minmax(360px, 1.1fr) minmax(320px, 0.9fr);
      gap: 12px;
      padding: 12px;
      min-height: calc(100vh - 56px);
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }
    video {
      width: 100%;
      border-radius: 8px;
      background: #000;
    }
    .clock {
      font: 600 28px/1.1 ui-monospace, Consolas, monospace;
      margin: 10px 0 6px;
      color: var(--accent);
    }
    .marks {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin: 8px 0;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 13px;
    }
    .mark span { color: var(--muted); }
    .mark strong { color: var(--warn); }
    .mark.frame strong { color: var(--ok); }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 10px 0;
    }
    button, label.file {
      background: #2a3350;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font: inherit;
    }
    button:hover, label.file:hover { border-color: var(--accent); }
    button.primary { background: #2f4f86; }
    button.danger { background: #5a2b2b; }
    input[type="text"], textarea {
      width: 100%;
      background: #0f121a;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 10px;
      font: inherit;
    }
    textarea { min-height: 56px; resize: vertical; }
    .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 8px;
    }
    kbd {
      background: #0f121a;
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
      font: 11px ui-monospace, Consolas, monospace;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    th, td {
      border-bottom: 1px solid var(--border);
      padding: 6px 4px;
      text-align: left;
      vertical-align: top;
    }
    th { color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--panel); }
    tr.selected { background: #24304a; }
    tr:hover { background: #222a3d; cursor: pointer; }
    .list-wrap { max-height: calc(100vh - 220px); overflow: auto; }
    .status { color: var(--ok); min-height: 1.2em; margin-top: 8px; font-size: 12px; }
    .status.err { color: var(--danger); }
  </style>
</head>
<body>
  <header>
    <h1>Listen beat annotator</h1>
    <div class="meta" id="videoMeta">video…</div>
    <div class="meta" id="beatCount">0 beats</div>
  </header>
  <main>
    <section class="panel">
      <video id="video" controls preload="metadata"></video>
      <div class="clock" id="clock">00:00.000</div>
      <div class="marks">
        <div class="mark">in <strong id="markIn">—</strong></div>
        <div class="mark">out <strong id="markOut">—</strong></div>
        <div class="mark frame">frame <strong id="markFrame">—</strong></div>
      </div>
      <label>note</label>
      <textarea id="note" placeholder="что на экране / что говорят"></textarea>
      <div class="toolbar">
        <button type="button" id="btnIn" title="I">Mark in (I)</button>
        <button type="button" id="btnOut" title="O">Mark out (O)</button>
        <button type="button" id="btnFrame" title="C">Frame here (C)</button>
        <button type="button" id="btnKeyframe" title="K">+ keyframe (K)</button>
        <button type="button" class="primary" id="btnAdd" title="Enter">Add beat</button>
        <button type="button" id="btnUpdate" title="U">Update selected</button>
        <button type="button" class="danger" id="btnDelete" title="Del">Delete</button>
      </div>
      <div class="toolbar">
        <button type="button" id="btnSeekIn">Go in</button>
        <button type="button" id="btnSeekOut">Go out</button>
        <button type="button" id="btnMid">Midpoint frame</button>
        <label class="file"><input type="file" id="importFile" accept=".json" hidden />Import JSON</label>
        <button type="button" id="btnExport">Export JSON</button>
        <button type="button" id="btnSave" class="primary">Save to server</button>
      </div>
      <div id="keyframesBox" class="hint" style="margin-top:0.5rem"></div>
      <div class="hint">
        <kbd>Space</kbd> play/pause · <kbd>I</kbd>/<kbd>O</kbd> in/out · <kbd>C</kbd> paired frame ·
        <kbd>K</kbd> motion keyframe (2+ = motion beat) ·
        <kbd>Enter</kbd> add · <kbd>U</kbd> update · <kbd>Del</kbd> delete ·
        <kbd>←</kbd>/<kbd>→</kbd> ±0.1s · <kbd>Shift+←/→</kbd> ±1s
      </div>
      <div class="status" id="status"></div>
    </section>
    <section class="panel">
      <div class="list-wrap">
        <table>
          <thead>
            <tr>
              <th>id</th><th>t0</th><th>t1</th><th>dur</th><th>visual</th><th>note</th>
            </tr>
          </thead>
          <tbody id="beatRows"></tbody>
        </table>
      </div>
    </section>
  </main>
  <script>
    const video = document.getElementById("video");
    const clock = document.getElementById("clock");
    const markIn = document.getElementById("markIn");
    const markOut = document.getElementById("markOut");
    const markFrame = document.getElementById("markFrame");
    const noteEl = document.getElementById("note");
    const beatRows = document.getElementById("beatRows");
    const statusEl = document.getElementById("status");
    const beatCount = document.getElementById("beatCount");
    const videoMeta = document.getElementById("videoMeta");
    const keyframesBox = document.getElementById("keyframesBox");

    function beatKind(b) {
      if (b.kind === "motion") return "motion";
      if (Array.isArray(b.keyframes) && b.keyframes.length >= 2) return "motion";
      return "paired";
    }

    function visualSummary(b) {
      if (beatKind(b) === "motion") {
        const n = (b.keyframes || []).length;
        return `motion×${n}`;
      }
      return b.frame_t != null ? b.frame_t.toFixed(2) : "—";
    }

    function syncKeyframesPanel() {
      if (selected < 0 || !beats[selected]) {
        keyframesBox.textContent = "";
        return;
      }
      const b = beats[selected];
      const kfs = b.keyframes || [];
      if (!kfs.length) {
        keyframesBox.textContent = "visual: paired (1 кадр через C или midpoint)";
        return;
      }
      keyframesBox.textContent = `keyframes: ${kfs.map((k, i) => `#${i}@${Number(k.frame_t).toFixed(2)}s`).join(" · ")}`;
    }

    function applyVisualFields(b) {
      if (beatKind(b) === "motion") {
        b.kind = "motion";
        delete b.frame_t;
        delete b.path;
      } else {
        b.kind = "paired";
        delete b.keyframes;
        if (draftFrame != null) b.frame_t = round3(draftFrame);
      }
    }

    function exportBeat(b) {
      const row = {
        id: b.id,
        t0: b.t0,
        t1: b.t1,
        note: b.note || "",
        kind: beatKind(b),
      };
      if (row.kind === "motion") {
        row.keyframes = (b.keyframes || []).map((k) => ({ frame_t: round3(k.frame_t) }));
      } else if (b.frame_t != null) {
        row.frame_t = round3(b.frame_t);
      }
      return row;
    }

    let draftIn = null;
    let draftOut = null;
    let draftFrame = null;
    let beats = [];
    let selected = -1;
    let savePath = "";

    function fmt(t) {
      if (t == null || Number.isNaN(t)) return "—";
      const sign = t < 0 ? "-" : "";
      t = Math.abs(t);
      const m = Math.floor(t / 60);
      const s = t - m * 60;
      return `${sign}${String(m).padStart(2, "0")}:${s.toFixed(3).padStart(6, "0")}`;
    }
    function round3(t) { return Math.round(t * 1000) / 1000; }

    function setStatus(msg, isErr = false) {
      statusEl.textContent = msg;
      statusEl.classList.toggle("err", isErr);
    }

    function refreshMarks() {
      markIn.textContent = draftIn == null ? "—" : fmt(draftIn);
      markOut.textContent = draftOut == null ? "—" : fmt(draftOut);
      markFrame.textContent = draftFrame == null ? "—" : fmt(draftFrame);
    }

    function renumber() {
      beats.forEach((b, i) => { b.id = `b${String(i).padStart(3, "0")}`; });
    }

    function renderBeats() {
      renumber();
      beatRows.innerHTML = "";
      beats.forEach((b, i) => {
        const tr = document.createElement("tr");
        if (i === selected) tr.classList.add("selected");
        const dur = round3(b.t1 - b.t0);
        tr.innerHTML = `
          <td>${b.id}</td>
          <td>${b.t0.toFixed(2)}</td>
          <td>${b.t1.toFixed(2)}</td>
          <td>${dur.toFixed(2)}</td>
          <td>${visualSummary(b)}</td>
          <td>${escapeHtml(b.note || "")}</td>`;
        tr.addEventListener("click", () => selectBeat(i));
        beatRows.appendChild(tr);
      });
      beatCount.textContent = `${beats.length} beats`;
      syncKeyframesPanel();
    }

    function escapeHtml(s) {
      return s.replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      })[c]);
    }

    function selectBeat(i) {
      selected = i;
      if (i >= 0 && beats[i]) {
        const b = beats[i];
        draftIn = b.t0;
        draftOut = b.t1;
        if (b.frame_t != null) {
          draftFrame = round3(b.frame_t);
        } else if (b.keyframes?.length) {
          draftFrame = round3(b.keyframes[0].frame_t);
        } else {
          draftFrame = round3((b.t0 + b.t1) / 2);
        }
        noteEl.value = b.note || "";
        video.pause();
        seekVideo(beatSeekTime(b));
      }
      refreshMarks();
      renderBeats();
    }

    function addKeyframe() {
      if (selected < 0 || !beats[selected]) {
        setStatus("Выбери beat для keyframe", true);
        return;
      }
      const b = beats[selected];
      if (!b.keyframes) b.keyframes = [];
      b.keyframes.push({ frame_t: currentTime() });
      b.keyframes.sort((a, c) => a.frame_t - c.frame_t);
      b.kind = b.keyframes.length >= 2 ? "motion" : "paired";
      if (b.kind === "motion") {
        delete b.frame_t;
      }
      renderBeats();
      setStatus(`Keyframe @${currentTime().toFixed(2)}s → ${b.id} (${b.keyframes.length})`);
    }

    function currentTime() { return round3(video.currentTime || 0); }

    function beatSeekTime(b) {
      if (!b) return 0;
      if (beatKind(b) === "motion" && b.keyframes?.length) {
        return Number(b.keyframes[0].frame_t);
      }
      if (b.frame_t != null) return Number(b.frame_t);
      return Number(b.t0);
    }

    function seekVideo(t) {
      const target = Math.max(0, Number(t) || 0);
      const apply = () => {
        const dur = video.duration;
        const clamped = Number.isFinite(dur) && dur > 0
          ? Math.min(target, Math.max(0, dur - 0.05))
          : target;
        const verify = () => {
          if (Math.abs(video.currentTime - clamped) > 0.2) {
            video.currentTime = clamped;
          }
        };
        video.addEventListener("seeked", verify, { once: true });
        video.currentTime = clamped;
      };
      if (video.readyState >= 2) apply();
      else video.addEventListener("canplay", apply, { once: true });
    }

    function addBeat() {
      if (draftIn == null || draftOut == null) {
        setStatus("Нужны in и out", true);
        return;
      }
      if (draftOut <= draftIn) {
        setStatus("out должен быть > in", true);
        return;
      }
      const frame_t = draftFrame ?? round3((draftIn + draftOut) / 2);
      const row = {
        id: "b000",
        t0: round3(draftIn),
        t1: round3(draftOut),
        note: noteEl.value.trim(),
      };
      if (draftFrame != null) row.frame_t = frame_t;
      beats.push(row);
      beats.sort((a, b) => a.t0 - b.t0);
      selected = beats.findIndex((b) => b.t0 === round3(draftIn) && b.t1 === round3(draftOut));
      renderBeats();
      setStatus(`Добавлен ${beats[selected]?.id || "beat"}`);
      draftIn = draftOut;
      draftOut = null;
      draftFrame = null;
      refreshMarks();
    }

    function updateSelected() {
      if (selected < 0 || !beats[selected]) {
        setStatus("Выбери beat в списке", true);
        return;
      }
      if (draftIn == null || draftOut == null || draftOut <= draftIn) {
        setStatus("Некорректные in/out", true);
        return;
      }
      const b = beats[selected];
      b.t0 = round3(draftIn);
      b.t1 = round3(draftOut);
      b.note = noteEl.value.trim();
      if (beatKind(b) === "paired") {
        b.frame_t = draftFrame ?? round3((b.t0 + b.t1) / 2);
        delete b.keyframes;
        b.kind = "paired";
      }
      beats.sort((a, b) => a.t0 - b.t0);
      selected = beats.indexOf(b);
      renderBeats();
      setStatus(`Обновлён ${b.id}`);
    }

    function deleteSelected() {
      if (selected < 0) return;
      const id = beats[selected].id;
      beats.splice(selected, 1);
      selected = Math.min(selected, beats.length - 1);
      if (selected >= 0) selectBeat(selected);
      else renderBeats();
      setStatus(`Удалён ${id}`);
    }

    function exportJson() {
      renumber();
      const payload = beats.map(exportBeat);
      const blob = new Blob([JSON.stringify(payload, null, 2) + "\n"], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "listen-beats.json";
      a.click();
      URL.revokeObjectURL(a.href);
      setStatus("JSON скачан");
    }

    async function saveToServer() {
      if (!savePath) {
        setStatus("Сервер не передал save path", true);
        return;
      }
      renumber();
      const payload = beats.map(exportBeat);
      const res = await fetch("/api/save", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ path: savePath, beats: payload }),
      });
      const data = await res.json();
      if (!res.ok) {
        setStatus(data.error || "save failed", true);
        return;
      }
      setStatus(`Сохранено: ${data.path}`);
    }

    function tickClock() {
      clock.textContent = fmt(video.currentTime || 0);
      requestAnimationFrame(tickClock);
    }

    function seekBy(delta) {
      video.currentTime = Math.max(0, Math.min(video.duration || 0, (video.currentTime || 0) + delta));
    }

    document.getElementById("btnIn").onclick = () => { draftIn = currentTime(); refreshMarks(); };
    document.getElementById("btnOut").onclick = () => { draftOut = currentTime(); refreshMarks(); };
    document.getElementById("btnFrame").onclick = () => { draftFrame = currentTime(); refreshMarks(); };
    document.getElementById("btnAdd").onclick = addBeat;
    document.getElementById("btnUpdate").onclick = updateSelected;
    document.getElementById("btnDelete").onclick = deleteSelected;
    document.getElementById("btnSeekIn").onclick = () => { if (draftIn != null) seekVideo(draftIn); };
    document.getElementById("btnSeekOut").onclick = () => { if (draftOut != null) seekVideo(draftOut); };
    document.getElementById("btnKeyframe").onclick = addKeyframe;
    document.getElementById("btnMid").onclick = () => {
      if (draftIn != null && draftOut != null) {
        draftFrame = round3((draftIn + draftOut) / 2);
        refreshMarks();
      }
    };
    document.getElementById("btnExport").onclick = exportJson;
    document.getElementById("btnSave").onclick = saveToServer;
    document.getElementById("importFile").onchange = async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      try {
        beats = JSON.parse(await file.text());
        selected = beats.length ? 0 : -1;
        if (selected >= 0) selectBeat(0);
        else renderBeats();
        setStatus(`Импорт: ${beats.length} beats`);
      } catch (err) {
        setStatus(`Импорт failed: ${err}`, true);
      }
      e.target.value = "";
    };

    document.addEventListener("keydown", (e) => {
      if (e.target === noteEl) {
        if (e.key === "Enter" && e.ctrlKey) { e.preventDefault(); addBeat(); }
        return;
      }
      if (e.code === "Space") { e.preventDefault(); video.paused ? video.play() : video.pause(); }
      else if (e.key === "i" || e.key === "I") { draftIn = currentTime(); refreshMarks(); }
      else if (e.key === "o" || e.key === "O") { draftOut = currentTime(); refreshMarks(); }
      else if (e.key === "c" || e.key === "C") { draftFrame = currentTime(); refreshMarks(); }
      else if (e.key === "k" || e.key === "K") { addKeyframe(); }
      else if (e.key === "Enter") { e.preventDefault(); addBeat(); }
      else if (e.key === "u" || e.key === "U") { updateSelected(); }
      else if (e.key === "Delete") { deleteSelected(); }
      else if (e.key === "ArrowLeft") { e.preventDefault(); seekBy(e.shiftKey ? -1 : -0.1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); seekBy(e.shiftKey ? 1 : 0.1); }
    });

    async function boot() {
      const cfg = await fetch("/api/config").then((r) => r.json());
      video.src = cfg.video_url;
      videoMeta.textContent = cfg.video_label || cfg.video_url;
      savePath = cfg.save_path || "";
      const initBeats = () => {
        if (cfg.beats?.length) {
          beats = cfg.beats;
          selectBeat(0);
        } else {
          renderBeats();
        }
        setStatus("Готов. Space — play/pause.");
      };
      if (video.readyState >= 1) initBeats();
      else video.addEventListener("loadedmetadata", initBeats, { once: true });
    }

    tickClock();
    boot();
  </script>
</body>
</html>
