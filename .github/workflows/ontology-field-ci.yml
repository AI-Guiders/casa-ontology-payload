name: ontology-field-ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r tools/requirements-dev.txt
      - name: No absolute paths (CI-critical trees)
        run: python scripts/check_no_abs_paths.py --scope ci
      - name: M4 layout (manifest + canonical paths)
        run: python scripts/check_tools_shims.py --allow-tools-shims
      - name: Oracle audit (no re-introduced compose oracles on the dialogue hot path)
        run: python tools/oracle_audit.py --strict
      - name: Unit tests
        run: pytest
      - name: CI smoke train + bench
        run: python -m casa.cli ci_smoke_bench --repo-root . --epochs 120 --seeds 5
