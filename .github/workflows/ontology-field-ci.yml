name: ontology-field-ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r tools/requirements-dev.txt
      - name: No absolute paths (full tracked tree)
        run: python scripts/check_no_abs_paths.py --scope all
      - name: Tools are casa shims (M2 layout)
        run: python scripts/check_tools_shims.py
      - name: Unit tests (predictor ranking contract)
        run: pytest
      - name: CI smoke train + bench
        run: python tools/ci_smoke_bench.py --repo-root . --epochs 120 --seeds 5
