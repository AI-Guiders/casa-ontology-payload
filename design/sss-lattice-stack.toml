# Second signal system — lattice stack on z
# Canon: design/sss-multi-lattice-z.md

schema_version = 1
subsystem = "sss"
title = "Second signal system — lattice stack on z"
doc = "design/sss-multi-lattice-z.md"
deprecated_interim = "design/layout.v1.json (y-bands on single grid)"

[axes]
x = "cell within lattice"
y = "cell within lattice"
z_level = "which lattice (L0..L3); full grid per level"
z_phase = "encode | repair | digest within one lattice (see layered-ca-phases.json)"
t = "CA micro-steps inside z_phase"
T = "agent macro tick"

[[lattices]]
id = "L0_grapheme_cyrl"
z_level = 0
size = { width = 32, height = 32 }
concept_prefix = "grapheme.cyrl."
script = "cyrl"
role = ["listen", "babble_robust"]

[[lattices]]
id = "L0_grapheme_latn"
z_level = 0
size = { width = 32, height = 32 }
concept_prefix = "grapheme.latn."
script = "latn"
role = ["listen", "babble_robust"]

[[lattices]]
id = "L0_vk_physical"
z_level = 0
size = { width = 48, height = 48 }
concept_prefix = "vk."
role = ["keyboard", "modifiers"]

[[lattices]]
id = "L0_layout_qwerty_us"
z_level = 0
size = { width = 32, height = 32 }
concept_prefix = "layout."
locale = "en"
role = ["keyboard", "compose"]

[[lattices]]
id = "L0_layout_jcuken_ru"
z_level = 0
size = { width = 32, height = 32 }
concept_prefix = "layout."
locale = "ru"
role = ["keyboard", "compose"]

[[lattices]]
id = "L0_punct_latn"
z_level = 0
size = { width = 32, height = 32 }
concept_prefix = "punct.latn."
role = ["punctuation"]

[[lattices]]
id = "L0_punct_cyrl"
z_level = 0
size = { width = 32, height = 32 }
concept_prefix = "punct.cyrl."
role = ["punctuation"]

[[lattices]]
id = "L1_syllable"
z_level = 1
size = { width = 32, height = 32 }
concept_prefix = "syllable."
role = ["compose_up", "babble"]

[[lattices]]
id = "L2_word"
z_level = 2
size = { width = 32, height = 32 }
concept_prefix = "lang.word."
role = ["compose_up", "babble"]

[[lattices]]
id = "L3_phrase"
z_level = 3
size = { width = 32, height = 32 }
concept_prefix = "ru.dialog."
role = ["phrase", "babble"]

[[z_bridges]]
id = "z_bridge_L0cyrl_L1"
from = "L0_grapheme_cyrl"
to = "L1_syllable"
kind = "compose"
coupling = "local_3x3_xy"
channels = ["zbr.compose.*"]

[[z_bridges]]
id = "z_bridge_L0latn_L1"
from = "L0_grapheme_latn"
to = "L1_syllable"
kind = "compose"
coupling = "local_3x3_xy"
channels = ["zbr.compose.*"]

[[z_bridges]]
id = "z_bridge_L1_L2"
from = "L1_syllable"
to = "L2_word"
kind = "compose"
coupling = "local_3x3_xy"
channels = ["zbr.compose.*"]

[[z_bridges]]
id = "z_bridge_L2_L3"
from = "L2_word"
to = "L3_phrase"
kind = "bind"
coupling = "local_3x3_xy"
channels = ["zbr.bind.*"]

[routing]
sn = ["active_lattice", "allow_compose_up"]
cen = ["surface_from_active_lattice", "correct_on_z_bridge"]

[routing.l2_sharding]
doc = "design/l2-lattice-sharding.md"
enabled_default = true
num_shards = 64
legacy_lattice = "L2_word"
shard_pattern = "L2_word_{idx:02d}"
nca_per_shard = true

[first_signal_stack]
status = "design"
doc = "design/f0-math-logical-layer.md"
machine = "design/f0-math-lattice-stack.json"
lattices = ["F0_schema", "F1_compose", "F2_quantity", "F0_vis"]
hub_edges_to = "L2_word"
