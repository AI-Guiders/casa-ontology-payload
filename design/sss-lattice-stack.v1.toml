# SSS lattice stack — v1 ids (alphabet per locale)
# Canon: design/lattice-naming-v1.md

schema_version = 2
subsystem = "sss"
title = "SSS lattice stack — v1 ids"
doc = "design/lattice-naming-v1.md"
