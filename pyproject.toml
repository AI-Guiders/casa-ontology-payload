[project]
name = "casa-ontology-payload"
version = "0.0.0"
description = "CASA research lab: bilingual T9, lattice stores, NCA repair (research preview)."
requires-python = ">=3.12"

# M2: canonical code under `casa/prisms/`; `tools/` keeps thin shims + CLIs.
# `pythonpath` lets tests import both legacy module names and `casa.*`.

[tool.pytest.ini_options]
pythonpath = [".", "tools"]
testpaths = ["tests"]
addopts = "-q"

[tool.pyright]
extraPaths = [".", "tools"]
